name: Build Remote 3 Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INTG_NAME: homeassistantcustom
  PYTHON_VER: 3.11.13-0.7.0

jobs:
  build:
    name: Build aarch64 integration
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build with Unfolded Circle PyInstaller image
        run: |
          rm -rf dist artifacts
          docker run --rm \
            --platform=linux/arm64/v8 \
            --user=$(id -u):$(id -g) \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "cd /workspace && \
             python -m pip install -r requirements.txt && \
             pyinstaller --clean --onedir --name intg-${INTG_NAME} driver.py"

      - name: Validate build output and metadata
        run: |
          set -euo pipefail
          test -d "dist/intg-${INTG_NAME}"
          test -x "dist/intg-${INTG_NAME}/intg-${INTG_NAME}"
          test -f driver.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('driver.json').read_text(encoding='utf-8'))
          required = {
              'driver_id', 'version', 'min_core_api', 'name', 'icon',
              'description', 'developer', 'home_page', 'release_date'
          }
          missing = required.difference(data)
          if missing:
              raise SystemExit(f'Missing driver.json keys: {sorted(missing)}')
          if not isinstance(data['driver_id'], str) or len(data['driver_id']) < 5:
              raise SystemExit('driver_id must contain at least 5 characters')
          if not data['driver_id'][0].islower():
              raise SystemExit('driver_id must start with a lowercase letter')
          allowed = set('abcdefghijklmnopqrstuvwxyz0123456789-_')
          if any(ch not in allowed for ch in data['driver_id']):
              raise SystemExit('driver_id contains an invalid character')
          if data['icon'] != 'uc:integration':
              raise SystemExit('driver.json must use the built-in uc:integration icon')
          dev = data['developer']
          for key in ('name', 'email', 'url'):
              if not isinstance(dev.get(key), str) or not dev[key].strip():
                  raise SystemExit(f'developer.{key} must be present and non-empty')
          if 'port' in data:
              raise SystemExit('driver.json must not contain a hard-coded port; the Remote runtime supplies UC_INTEGRATION_HTTP_PORT')
          print('driver.json OK:', data['driver_id'], data['version'])
          PY

      - name: Prepare installation archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts/bin

          # Unfolded Circle custom integration layout:
          # - driver.json directly at archive root
          # - PyInstaller one-folder bundle directly below ./bin
          cp -a "dist/intg-${INTG_NAME}/." artifacts/bin/
          mv "artifacts/bin/intg-${INTG_NAME}" "artifacts/bin/driver"
          cp driver.json artifacts/driver.json

          test -f artifacts/driver.json
          test -x artifacts/bin/driver
          test ! -d artifacts/bin/driver

          # Pack the root entries explicitly instead of archiving '.'.
          # This produces exact archive member names 'driver.json' and 'bin/...'.
          tar -czf "uc-intg-${INTG_NAME}-aarch64.tar.gz" -C artifacts driver.json bin

          tar -tzf "uc-intg-${INTG_NAME}-aarch64.tar.gz" > archive.contents
          cat archive.contents
          grep -Fxq 'driver.json' archive.contents
          grep -Fxq 'bin/driver' archive.contents
          if grep -Eq '(^|/)\.\./|(^|/)\./' archive.contents; then
            echo 'Unexpected relative archive path found'
            exit 1
          fi
          rm -f archive.contents
          sha256sum "uc-intg-${INTG_NAME}-aarch64.tar.gz" > "uc-intg-${INTG_NAME}-aarch64.tar.gz.sha256"

      - name: Upload install archive
        uses: actions/upload-artifact@v4
        with:
          name: uc-intg-${{ env.INTG_NAME }}-aarch64
          path: |
            uc-intg-${{ env.INTG_NAME }}-aarch64.tar.gz
            uc-intg-${{ env.INTG_NAME }}-aarch64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read driver version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          print(json.load(open('driver.json', encoding='utf-8'))['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: uc-intg-${{ env.INTG_NAME }}-aarch64
          path: release-assets

      - name: Create GitHub release
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Stehlampe Integration v${{ steps.version.outputs.version }}
          prerelease: false
          generate_release_notes: false
          body: |
            # Stehlampe Integration v${{ steps.version.outputs.version }}

            Eigenständiger Home-Assistant-Custom-Driver für die Unfolded Circle Remote 3.

            ## Funktionen
            - Ein Gerät **Stehlampe** auf der Geräte-Seite, ohne Aktivität
            - **EIN/AUS**
            - **HELLER**
            - **DUNKLER**
            - **MODUS**
            - Physische Lautstärketasten: **VOL+ → HELLER**, **VOL− → DUNKLER**
            - Home Assistant REST API: `remote.send_command`
            - Standard: `remote.broadlink` + Gerät `Stehlampe`

            ## v${{ steps.version.outputs.version }} Änderungen
            - Kompatiblere Custom-Driver-Metadaten inklusive `developer.email`
            - `uc:integration` als eingebautes Icon
            - Kein fest codierter Integrations-Port in `driver.json`
            - Exakter Archiv-Root ohne `./`-Präfixe: `driver.json` und `bin/driver`
            - Home Assistant wird erst beim Ausführen eines Lampenbefehls kontaktiert

            ## Installation
            Das Asset `uc-intg-homeassistantcustom-aarch64.tar.gz` ist im Remote-3-Web-Configurator unter **Install custom** verwendbar.

            Bei einer bereits installierten Version die Option **Installierte Integration aktualisieren** nur dann aktivieren, wenn diese vorhandene Installation ebenfalls die `driver_id` `homeassistantcustom` verwendet.
          files: |
            release-assets/uc-intg-homeassistantcustom-aarch64.tar.gz
            release-assets/uc-intg-homeassistantcustom-aarch64.tar.gz.sha256
