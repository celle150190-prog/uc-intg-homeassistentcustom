name: Build Remote 3 Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  INTG_NAME: homeassistantcustom
  PYTHON_VER: 3.11.13-0.7.0

jobs:
  build:
    name: Build aarch64 integration
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build with Unfolded Circle PyInstaller image
        run: |
          rm -rf dist artifacts
          docker run --rm \
            --platform=linux/arm64/v8 \
            --user=$(id -u):$(id -g) \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "cd /workspace && \
             python -m pip install -r requirements.txt && \
             pyinstaller --clean --onedir --add-data 'driver.json:.' --name intg-${INTG_NAME} driver.py"

      - name: Validate build output and metadata
        run: |
          test -d "dist/intg-${INTG_NAME}"
          test -x "dist/intg-${INTG_NAME}/intg-${INTG_NAME}"
          test -f "dist/intg-${INTG_NAME}/_internal/driver.json"
          test -f driver.json
          test -f config/config.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('driver.json').read_text(encoding='utf-8'))
          bundled = json.loads(Path('dist/intg-homeassistantcustom/_internal/driver.json').read_text(encoding='utf-8'))
          required = {'driver_id', 'version', 'min_core_api', 'name', 'icon', 'description', 'developer', 'home_page'}
          missing = required.difference(source)
          if missing:
              raise SystemExit(f'Missing driver.json keys: {sorted(missing)}')
          if source['driver_id'] != 'stehlampe-ha':
              raise SystemExit(f"Unexpected driver_id: {source['driver_id']}")
          if 'port' in source:
              raise SystemExit('driver.json must not contain a hard-coded port; the Remote runtime supplies UC_INTEGRATION_HTTP_PORT.')
          if source['icon'] != 'uc:integration':
              raise SystemExit('driver.json must use the known built-in icon uc:integration.')
          if source != bundled:
              raise SystemExit('Bundled driver.json does not match archive-root driver.json')
          print('driver.json OK:', source['driver_id'], source['version'])
          print('Bundled driver.json OK')
          print('config/config.json OK')
          PY

      - name: Prepare installation archive
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts/bin artifacts/config
          cp -a "dist/intg-${INTG_NAME}/." artifacts/bin/
          mv "artifacts/bin/intg-${INTG_NAME}" "artifacts/bin/driver"
          cp driver.json artifacts/driver.json
          cp -a config/. artifacts/config/

          test -f artifacts/driver.json
          test -x artifacts/bin/driver
          test ! -d artifacts/bin/driver
          test -f artifacts/config/config.json

          tar -czf "uc-intg-${INTG_NAME}-aarch64.tar.gz" -C artifacts .
          tar -tzf "uc-intg-${INTG_NAME}-aarch64.tar.gz" > archive.contents
          cat archive.contents
          grep -Fxq './driver.json' archive.contents
          grep -Fxq './bin/driver' archive.contents
          grep -Fxq './config/config.json' archive.contents
          ! grep -E '(^|/)([^/ ]+ )|\([0-9]+\)\.tar\.gz$' archive.contents
          rm -f archive.contents
          sha256sum "uc-intg-${INTG_NAME}-aarch64.tar.gz" > "uc-intg-${INTG_NAME}-aarch64.tar.gz.sha256"

      - name: Smoke-test packaged driver binary
        shell: bash
        run: |
          timeout 8s "artifacts/bin/driver" >/tmp/driver-smoke.log 2>&1 || true
          cat /tmp/driver-smoke.log
          if grep -Eqi 'FileNotFoundError.*driver.json|No such file or directory.*driver.json|Traceback .*driver.py' /tmp/driver-smoke.log; then
            echo 'Packaged driver failed to locate its bundled driver.json.'
            exit 1
          fi
          grep -Eqi 'integration port|UC_INTEGRATION_HTTP_PORT|started|listening|driver' /tmp/driver-smoke.log

      - name: Upload install archive
        uses: actions/upload-artifact@v4
        with:
          name: uc-intg-${{ env.INTG_NAME }}-aarch64
          path: |
            uc-intg-${{ env.INTG_NAME }}-aarch64.tar.gz
            uc-intg-${{ env.INTG_NAME }}-aarch64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read driver version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          print(json.load(open('driver.json', encoding='utf-8'))['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: uc-intg-${{ env.INTG_NAME }}-aarch64
          path: release-assets

      - name: Create GitHub release
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Stehlampe Integration v${{ steps.version.outputs.version }}
          prerelease: false
          generate_release_notes: false
          body: |
            # Stehlampe Integration v${{ steps.version.outputs.version }}

            Eigenständiger Home-Assistant-Custom-Driver für die Unfolded Circle Remote 3.

            ## Funktionen
            - Ein Gerät **Stehlampe** auf der Geräte-Seite, ohne Aktivität
            - **EIN/AUS**
            - **HELLER**
            - **DUNKLER**
            - **MODUS**
            - Physische Lautstärketasten: **VOL+ → HELLER**, **VOL− → DUNKLER**
            - Nutzt die vier vorhandenen Home-Assistant-Skripte für die Stehlampe

            ## v${{ steps.version.outputs.version }} Änderungen
            - `driver.json` wird jetzt explizit in das PyInstaller-Runtime-Bundle aufgenommen.
            - Der Driver verwendet im PyInstaller-Betrieb das gebündelte `driver.json` unter `_internal`.
            - Build-Prüfung vergleicht das gebündelte und das Archiv-`driver.json` bytegenau inhaltlich.
            - Installationsarchiv wird strukturell geprüft.
            - Smoke-Test des gepackten ARM64-Drivers verhindert erneut einen Startfehler durch fehlendes `driver.json`.

            ## Installation
            Das Asset `uc-intg-homeassistantcustom-aarch64.tar.gz` ist im Remote-3-Web-Configurator unter **Install custom** verwendbar.

            **Kein Update der eingebauten Home-Assistant-Integration:** Dieser Driver verwendet die separate `driver_id` `stehlampe-ha`.
          files: |
            release-assets/uc-intg-homeassistantcustom-aarch64.tar.gz
            release-assets/uc-intg-homeassistantcustom-aarch64.tar.gz.sha256
