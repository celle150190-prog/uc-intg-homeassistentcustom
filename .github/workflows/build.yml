name: Build Remote 3 Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INTG_NAME: homeassistantcustom
  PYTHON_VER: 3.11.13-0.7.0

jobs:
  build:
    name: Build aarch64 integration
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build with Unfolded Circle PyInstaller image
        run: |
          rm -rf dist artifacts
          docker run --rm \
            --platform=linux/arm64/v8 \
            --user=$(id -u):$(id -g) \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "cd /workspace && \
             python -m pip install -r requirements.txt && \
             pyinstaller --clean --onedir --name intg-${INTG_NAME} driver.py"

      - name: Validate build output
        run: |
          test -d "dist/intg-${INTG_NAME}"
          test -x "dist/intg-${INTG_NAME}/intg-${INTG_NAME}"
          test -f driver.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('driver.json').read_text(encoding='utf-8'))
          required = {'driver_id', 'version', 'name', 'description', 'port'}
          missing = required.difference(data)
          if missing:
              raise SystemExit(f'Missing driver.json keys: {sorted(missing)}')
          print('driver.json OK:', data['driver_id'], data['version'])
          PY

      - name: Prepare installation archive
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts/bin

          # Unfolded Circle requires driver.json in the archive root and the
          # PyInstaller one-folder bundle contents directly below ./bin.
          # The executable itself must be named ./bin/driver.
          cp -a "dist/intg-${INTG_NAME}/." artifacts/bin/
          mv "artifacts/bin/intg-${INTG_NAME}" "artifacts/bin/driver"
          cp driver.json artifacts/driver.json

          test -f artifacts/driver.json
          test -x artifacts/bin/driver
          test ! -d artifacts/bin/driver

          tar -czf "uc-intg-${INTG_NAME}-aarch64.tar.gz" -C artifacts .
          tar -tzf "uc-intg-${INTG_NAME}-aarch64.tar.gz" > archive.contents
          cat archive.contents
          grep -Fxq './driver.json' archive.contents
          grep -Fxq './bin/driver' archive.contents
          rm -f archive.contents
          sha256sum "uc-intg-${INTG_NAME}-aarch64.tar.gz" > "uc-intg-${INTG_NAME}-aarch64.tar.gz.sha256"

      - name: Upload install archive
        uses: actions/upload-artifact@v4
        with:
          name: uc-intg-${{ env.INTG_NAME }}-aarch64
          path: |
            uc-intg-${{ env.INTG_NAME }}-aarch64.tar.gz
            uc-intg-${{ env.INTG_NAME }}-aarch64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read driver version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          print(json.load(open('driver.json', encoding='utf-8'))['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: uc-intg-${{ env.INTG_NAME }}-aarch64
          path: release-assets

      - name: Create GitHub release
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Stehlampe Integration v${{ steps.version.outputs.version }}
          prerelease: false
          generate_release_notes: false
          body: |
            # Stehlampe Integration v${{ steps.version.outputs.version }}

            Fehlerbereinigtes Release der eigenständigen Home-Assistant-Custom-Integration für die Unfolded Circle Remote 3.

            ## Behobene Probleme
            - Korrekte Struktur des TAR.GZ-Installationsarchivs
            - `driver.json` liegt direkt im Archiv-Root
            - Der PyInstaller-OneDir-Inhalt liegt direkt unter `./bin`
            - Der ausführbare Treiber liegt als `./bin/driver` vor
            - Die Archivstruktur wird vor der Veröffentlichung automatisch geprüft

            ## Funktionen
            - Eigenes Gerät **Stehlampe** auf der Geräte-Seite, ohne Aktivität
            - **EIN/AUS**
            - **HELLER**
            - **DUNKLER**
            - **MODUS**
            - Physische Lautstärketasten: **VOL+ → HELLER**, **VOL− → DUNKLER**
            - Direkte Ansteuerung von Home Assistant über `remote.send_command`
            - Standardmäßig `remote.broadlink` und Gerät `Stehlampe`
            - Konfigurierbare Home-Assistant-URL, Long-Lived Access Token, Remote-Entity, Gerätename und Befehlsverzögerung

            ## Home Assistant
            Die Integration sendet die Befehle `EIN/AUS`, `HELLER`, `DUNKLER` und `MODUS` an das Home-Assistant-Remote-Gerät `remote.broadlink` mit dem Zielgerät `Stehlampe`.

            ## Installation
            Das Asset `uc-intg-homeassistantcustom-aarch64.tar.gz` ist direkt im Web-Configurator der Unfolded Circle Remote 3 unter **Install custom** verwendbar.

            Zusätzlich ist ein SHA-256-Prüfwert als separates Asset enthalten.
          files: |
            release-assets/uc-intg-homeassistantcustom-aarch64.tar.gz
            release-assets/uc-intg-homeassistantcustom-aarch64.tar.gz.sha256
