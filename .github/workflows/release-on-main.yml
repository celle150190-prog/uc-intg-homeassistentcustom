name: Release Remote 3 Integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  INTG_NAME: homeassistantcustom
  PYTHON_VER: 3.11.13-0.7.0

jobs:
  release:
    name: Build and release v1.0.0
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          print(json.load(open('driver.json', encoding='utf-8'))['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$VERSION" = "1.0.0"

      - name: Build with Unfolded Circle PyInstaller image
        run: |
          rm -rf dist artifacts
          docker run --rm \
            --platform=linux/arm64/v8 \
            --user=$(id -u):$(id -g) \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "cd /workspace && \
             python -m pip install -r requirements.txt && \
             pyinstaller --clean --onedir --name intg-${INTG_NAME} driver.py"

      - name: Validate build output
        run: |
          test -x dist/intg-${INTG_NAME}/intg-${INTG_NAME}
          test -f driver.json

      - name: Prepare release archive
        run: |
          mkdir -p artifacts/bin
          cp driver.json artifacts/driver.json
          mv dist/intg-${INTG_NAME} artifacts/bin/driver
          tar -czf uc-intg-${INTG_NAME}-aarch64.tar.gz -C artifacts .
          tar -tzf uc-intg-${INTG_NAME}-aarch64.tar.gz
          sha256sum uc-intg-${INTG_NAME}-aarch64.tar.gz > uc-intg-${INTG_NAME}-aarch64.tar.gz.sha256

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Stehlampe Integration v${{ steps.version.outputs.version }}
          prerelease: false
          generate_release_notes: false
          body: |
            # Stehlampe Integration v${{ steps.version.outputs.version }}

            Erste Release-Version der eigenständigen Home-Assistant-Custom-Integration für die Unfolded Circle Remote 3.

            ## Enthalten
            - Ein eigenes Gerät **Stehlampe** ohne Aktivität
            - **EIN/AUS**
            - **HELLER**
            - **DUNKLER**
            - **MODUS**
            - Physische Lautstärketasten: **VOL+ → HELLER**, **VOL− → DUNKLER**
            - Direkte Ansteuerung von Home Assistant über `remote.send_command`
            - Standardmäßig `remote.broadlink` und Gerät `Stehlampe`
            - Einstellbare Home-Assistant-URL, Long-Lived Access Token, Remote-Entity, Gerätename und Verzögerung

            ## Home Assistant
            Die Integration verwendet die vorhandene Remote-Entity `remote.broadlink` und sendet die Befehle `EIN/AUS`, `HELLER`, `DUNKLER` und `MODUS` an das Gerät `Stehlampe`.

            ## Installation
            Das Asset `uc-intg-homeassistantcustom-aarch64.tar.gz` ist als eigenständige Custom Integration für die Unfolded Circle Remote 3 gedacht.

            Der enthaltene SHA-256-Prüfwert ist als separates Asset beigefügt.
          files: |
            uc-intg-${{ env.INTG_NAME }}-aarch64.tar.gz
            uc-intg-${{ env.INTG_NAME }}-aarch64.tar.gz.sha256
